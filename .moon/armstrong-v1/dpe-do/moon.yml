---
$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  description: |
    Project for upgrading the armstrong-v1 convention set of dpe-do.
    See https://dpe-portal.zf-world.com/docs/default/Component/infr-dpe-do/user/dpecfg/#upgrading-the-convention-set.
  metadata:
    dpetplVersion: "0.3.2"

tasks:
  upgrade:
    command: 'python -m dpedo_armstrong.upgrade'
    description: |
      Upgrades the armstrong-v1 files to the latest versions.
      Local modifications will be overwritten, but can manually be merged in
      again.
      Must be run from a clean working tree with a working moon configuration.
    args:
      - "--cwd"
      - "$workspaceRoot"
      - "--log-level"
      - "INFO"
      - "--non-interactive"
    local: true
    options:
      cache: false

  clean:
    command: 'git clean -fdx'
    description: |
      Cleans the working tree by removing all untracked files and directories.
      This is useful to ensure that the upgrade task can run without any
      interference from local modifications.'
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true
