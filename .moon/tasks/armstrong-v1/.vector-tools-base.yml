$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  dpaFile:
    - "./BswWorkspace/EPS.dpa"
  genData:
    - "./BswWorkspace/Appl/GenData"
  genDataVtt:
    - "./BswWorkspace/Appl/GenDataVtt"
  dvLogFile:
    -  "./build/AutoGeneration/DvCfgCmdRealTarget.log"
  sipLocation:
    - "$env:SIP_HOME"

tasks:
  .backupAndDeleteGenData:
    description: Deletes current existing GenData folder
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "CleanGenData"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .backupAndDeleteGenDataVtt:
    description: Deletes current existing GenDataVtt folder
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "CleanGenDataVtt"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      mutex: lock
      envFile: ./.env

  .basicBswGeneration:
    description: Generates AutosarStack
    deps:
      - .backupAndDeleteGenData
      - .basicGenerationReal
      - .backupAndDeleteGenDataVtt
      - .basicGenerationVtt
    command: noop
    options:
      internal: true
      mutex: lock
      runDepsInParallel: false
      envFile: ./.env

  .basicGenerationReal:
    description: Generation REAL target
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "GenerateReal"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      envFile: ./.env
      internal: true
      mutex: lock

  .basicGenerationVtt:
    description: Generation Virtual target
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "GenerateVirtual"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    options:
      envFile: ./.env
      internal: true
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'

  .configure:
    description: Starts the DV-Configurator of the current project
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "Configurator"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .mssv:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "Mssv"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .rteAnalyzer:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
      - "RteAnalyzer"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .vca:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "VCA"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .sipModificationChecker:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "SipModificationChecker"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock

  .safetyCaseAnalysis:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; & zf-vector-toolchain
    args:
      - "SafetyCaseAnalysis"
      - "@group(sipLocation)"
      - "@group(dpaFile)"
      - "@group(genData)"
      - "@group(genDataVtt)"
      - '@dirs(conanOutputFolder)'
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
    options:
      internal: true
      cache: false
      envFile: ./.env
      mutex: lock
