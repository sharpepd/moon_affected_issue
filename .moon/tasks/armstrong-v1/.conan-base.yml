# Base moon tasks for conan command tasks.
# There are:
# - conanBaseCommandNoDep for general Conan commands that are not dependent on conan setup.
# - conanBaseCommand for general Conan commands
# - conanBaseCommandJson for commands requiring the json output in a file.
# In both cases, add the args and change the internal option to true when extending these
# tasks to perform a conan command.

# yamllint disable rule:line-length
# cSpell:ignore taskinglm
---
extends: "./.tools-install.yml"

fileGroups:
  conanHome:
    - "/.conan/**/*"
    - "!/.conan/**/p"

tasks:
  conanEnv:
    env:
      CONAN_HOME: $workspaceRoot/.conan
      ZF_CONAN_BASE_RECIPES_DISABLE_PROMPT: "1"
      DPE_CONAN_CONFIG_URL: "https://artifactory.cloud.zf-world.com/artifactory/azp037-generic-prod-local/public/tools/conan/configs/dpe-conan2-v1.zip"
      TSK_LICENSE_SERVER: "taskinglm.zf-world.com:27594;taskinglm-backup.zf-world.com:27594"
      TSK_LICENSE_KEY_SW160800: "PRODUCT"
      TSK_NO_ANONYMOUS: "1"
      TASKING_LICENSE_FILE: "7594@tasking.zf-world.com"
    options:
      internal: true
    deps:
      - "~:.installTools"

  conanBaseCommandNoDep:
    extends: conanEnv
    command: "conan"
    toolchain: conan
    options:
      outputStyle: "stream"
      cache: false
      mutex: "conanHome"

  conanBaseCommand:
    extends: "conanBaseCommandNoDep"
    toolchain: conan
    deps:
      - "^:conanSetup"
