# DO NOT MODIFY WITHOUT AGREEMENT WITH DPE-DO OWNERS
# CENTRALLY MANAGED FILE.
---
$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  autosarModelArxml:
    - 04-Components/AutosarAbstraction/Configuration/Config/**/*.arxml
  escanPackage:
    - CBD2301088
  escanDelivery:
    - D01

tasks:

  .setupRules:
    description: Use the autosar modelchecker tool to download ESCAN rule set.
    deps:
      - ~:conanInstall
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; java -classpath $env:CLASSPATH de.zf.ar.commandline.Main
    options:
      internal: true
    inputs:
      - "$CONAN_OUTPUT_FOLDER/conanbuild.ps1"
    outputs:
      - '$CONAN_OUTPUT_FOLDER/autosar-modelchecker/rules/**/*'
    args:
      - FetchRule
      - -i
      - "@group(escanPackage)"
      - -i
      - "@group(escanDelivery)"
      - -o
      - "$env:CONAN_OUTPUT_FOLDER/autosar-modelchecker/rules"
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'

  autosarModelCheckerLint:
    description: Linting with Autosar Model Checker
    deps:
      - ~:.setupRules
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; java -classpath $env:CLASSPATH de.zf.ar.commandline.Main
    inputs:
      - "$CONAN_OUTPUT_FOLDER/autosar-modelchecker/rules"
    args:
      - -x
      - --exclude "**/*{_pre.arxml,_rec.arxml,_preo_*.arxml,preu.arxml,_preo.arxml,_rec*.arxml,_AR*.arxml}"
      - -i
      - "@files(autosarModelArxml)"
      - -i
      - "$env:SIP_HOME/Microsar/Components"
      - -i
      - "$env:CONAN_OUTPUT_FOLDER/autosar-modelchecker/rules"
      - -o
      - "$env:CONAN_OUTPUT_FOLDER/autosar-modelchecker"
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
