# Tasks for build management (to be run on registration and completion events of
# a complete pipeline).
---
$schema: "https://moonrepo.dev/schemas/tasks.json"
fileGroups:
  # Private
  builddata:
    - "/build/task-data/builddata.json"
  buildEnvVars:
    - "$BUILD_SOURCEVERSION"
    - "$BUILD_REPOSITORY_ID"
    - "$BUILD_BUILDID"
    - "$BUILD_BUILDNUMBER"
    - "$IQM_INTEGRATION_UUID"
    - "$IQM_INTEGRATION_GROUP_ID"
    - "$IQM_QUEUE_ID"
    - "$SYSTEM_PULLREQUEST_PULLREQUESTID"
    - "$SYSTEM_TEAMFOUNDATIONCOLLECTIONURI"
    - "$SYSTEM_TEAMPROJECTID"
    - "$INTEGRITY_USER"
    - "$DPE_DRYRUN"
    - "$CI"


tasks:
  initWs:
    description: "Performs workspace set-up lifecycle task. Add dependencies to tasks that are needed to prepare the workspace."

  buildData:
    description: "Task to register the start of the build pipeline and collect project data into a json file."
    command: python
    args:
      - "-m"
      - "dpedo_armstrong.buildm"
      - "register"
      - "--pdb-project-id"
      - "@meta(projectId)"
      - "-o"
      - "@out(0)"
    inputs:
      - "@envs(buildEnvVars)"
    outputs:
      - "@group(builddata)"
    deps:
      - ~:initWs
    options:
      cache: true
      runInCI: always
      internal: true
    toolchain: python

  buildRegister:
    description: "Lifecycle task to register the start of the build pipeline."
    deps:
      - "~:buildData"

  buildComplete:
    description: "Task to mark the build pipeline complete."
    command: python
    args:
      - "-m"
      - "dpedo_armstrong.buildm"
      - "complete"
      - "--builddata"
      - "@group(builddata)"
    deps:
      - "~:buildRegister"
    options:
      cache: false
      runInCI: always
    toolchain: python
