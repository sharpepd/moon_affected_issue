# Tasks for a conan project that consumes Conan packages, but does not create
# one.

---
$schema: "https://moonrepo.dev/schemas/tasks.json"
extends: "./.conan-base.yml"

fileGroups:
  # public
  conanHostProfile:
    - "conan.profile"
  conanBuildProfile:
    - "windows"
  conanHome:
    - "/.conan/**/*"
    - "!/.conan/**/p"
  conanfile:
    - "conanfile.txt"
  conandata:
    - "conandata.yml"
  conanOutputFolder:
    - "build"
  # private
  conanInfo:
    - "build/task-data/conanInfo.conan.json"

tasks:
  conanInstall:
    extends: "conanBaseCommand"
    args:
      - install
      - "@files(conanfile)"
      - --output-folder
      - "@group(conanOutputFolder)"
      - "'-pr:h'"
      - "@group(conanHostProfile)"
      - "'-pr:b'"
      - "@group(conanBuildProfile)"
      - --build=missing
      - "--out-file"
      - "@out(0)"
      - "-f"
      - "json"
      - --conf tools.env.virtualenv:powershell=powershell
    inputs:
      - "@files(conandata)"
    outputs:
      - "./build/task-data/$task.conan.json"
      - build/**
    options:
      internal: false
      cache: false
    toolchain: conan

  conanInfo:
    extends: "conanBaseCommand"
    args:
      - inspect
      - "@files(conanfile)"
      - "--out-file"
      - "@out(0)"
      - "-f"
      - "json"
    inputs:
      - "@files(conandata)"
    outputs:
      - "./build/task-data/$task.conan.json"
      - "@group(conanInfo)"
    options:
      internal: true
      cache: true
    toolchain: conan
