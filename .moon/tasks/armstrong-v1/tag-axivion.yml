# CENTRALLY MANAGED FILE.
---
$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  axivionConfigurationFolder:
    - "./AutosarCompliance/AxivionCfg/Core"
  arxmlFiles: []

  axivionIrFile:
    - build/project.ir
  axivionRfgFile:
    - build/project.ir.rfg

tasks:

  .axivionCheckInstallation:
    command: conan list axivion
    toolchain: python
    options:
      internal: true
      cache: false

  .axivionCheckLicense:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; axivion_ci --help | Out-Null
    toolchain: system
    inputs:
      - "$CONAN_OUTPUT_FOLDER/conanbuild.ps1"
    options:
      outputStyle: hash
      internal: true
      cache: false
    deps:
      - ~:.axivionCheckInstallation
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'

  axivionBuildAndTest:
    description: |
      Loads source files and arxml to create database incl. IR and RFG
      `note`: Axivion License will not be delivered and has to be installed manually into the system
    command: '. "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; axivion_ci'
    toolchain: python
    deps:
      - ~:.axivionCheckLicense
    options:
      cache: false
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
      PYTHONDONTWRITEBYTECODE: "1"
      PROJECT_NAME: $project
      AXIVION_WORKSPACE_DATE: $datetime
      AXIVION_PROJECT_PATH: "$projectRoot"
      AXIVION_BUILD_PATH: '$CONAN_OUTPUT_FOLDER'
      BAUHAUS_CONFIG: "@dirs(axivionConfigurationFolder)"
      AUTOSAR_FILES: "@files(arxmlFiles)"
      COMPILE_COMMANDS_PATH: "$CONAN_OUTPUT_FOLDER/compile_commands.json"
      AXIVION_IR_FILE_PATH: "@group(axivionIrFile)"

  axivionTest:
    command: . "$env:CONAN_OUTPUT_FOLDER/conanbuild.ps1"; axivion_analysis
    deps:
      - ~:.axivionCheckLicense
    args:
      - --rule RunnableAccessComplianceCheck
      - --ir
      - "@files(axivionIrFile)"
      - --input_rfg
      - "@files(axivionRfgFile)"
      - --output_json "$CONAN_OUTPUT_FOLDER/axivion_report.json"
    toolchain: system
    inputs:
      - "@files(arxmlFiles)"
      - "@dirs(axivionConfigurationFolder)"
    options:
      cache: false
      outputStyle: stream
    env:
      CONAN_OUTPUT_FOLDER: '@dirs(conanOutputFolder)'
      PYTHONDONTWRITEBYTECODE: "1"
      PROJECT_NAME: $project
      AXIVION_WORKSPACE_DATE: $datetime
      AXIVION_PROJECT_PATH: "$projectRoot"
      AXIVION_BUILD_PATH: '$CONAN_OUTPUT_FOLDER'
      BAUHAUS_CONFIG: "@dirs(axivionConfigurationFolder)"
      AUTOSAR_FILES: "@files(arxmlFiles)"
      COMPILE_COMMANDS_PATH: "$CONAN_OUTPUT_FOLDER/compile_commands.json"
      AXIVION_IR_FILE_PATH: "@group(axivionIrFile)"
