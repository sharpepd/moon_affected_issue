# Tasks to use ptci
---
fileGroups:
  # Private
  builddata:
    - "/build/task-data/builddata.json"

tasks:
  ptciStatusImplemented:
    command: "python"
    toolchain: "python"
    args:
      - "-m"
      - "dpetasks.armstrong.ptci"
      - "implemented"
      - "-i"
      - "@group(builddata)"
    options:
      runInCI: true
      internal: true
      cache: false
    deps:
      - "#buildManagement:registerBuild"

  ptciStatusCiStatus:
    command: "python"
    toolchain: "python"
    args:
      - "-m"
      - "dpetasks.armstrong.ptci"
      - "ci-status"
      - "-i"
      - "@group(builddata)"
    deps:
      - "#buildManagement:registerBuild"
    options:
      runInCI: true
      internal: true
      cache: false
