---
$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  preCommitConfig:
    - ".moon/armstrong-v1/config/.pre-commit-config.yaml"
  clangFormatConfig:
    - ".clang-format"

tasks:
  precommitInstall:
    description: Install pre-commit plugins
    command: pre-commit install
    args:
      - "--config"
      - "@group(preCommitConfig)"
    options:
      internal: true
    inputs:
      - '@group(preCommitConfig)'

  clangConfig:
    description: Download .clang-format configuration file
    command: curl
    args:
      - "-n"
      - "-O"
      - "--ssl-no-revoke"
      - "https://artifactory.cloud.zf-world.com/artifactory/azp037-generic-dev-local/public/cfg/.clang-format"
    options:
      internal: true
    outputs:
      - '@group(clangFormatConfig)'
    deps:
      - precommitInstall

  precommitRun:
    description: Run pre-commit
    command: pre-commit run
    args:
      - "--all-files"
      - "-c"
      - "@group(preCommitConfig)"
    deps:
      - clangConfig
    inputs:
      - '@group(preCommitConfig)'
