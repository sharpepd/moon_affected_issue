---
$schema: "https://moonrepo.dev/schemas/tasks.json"
tasks:
  getStackAnalyzer:
    command: "choco install"
    args:
      - "absint.stackanalyzer.2410"
      - "-y"
      - "--source"
      - "https://artifactory.cloud.zf-world.com/artifactory/api/nuget/azp037-nuget-prod-local"
      - "--no-progress"

  getOtelCli:
    command: "choco install"
    args:
      - "equinix.otel-cli"
      - "-y"
      - "--source"
      - "https://artifactory.cloud.zf-world.com/artifactory/api/nuget/azp037-nuget-prod-local"
      - "--no-progress"
    deps:
      - "~:getStackAnalyzer"

  getLicense:
    command: "python -m dpetasks.armstrong.stack_analysis"
    args:
      - "get-absint-license"
    deps:
      - "~:getOtelCli"

  stackAnalysis:
    command: "python -m dpetasks.armstrong.stack_analysis"
    args:
      - "run-stack-analysis"
    deps:
      - "~:getLicense"
    outputs:
      - "./05-IntegrationTest/Manual/ResourceAnalyses/Reports"
    options:
      runFromWorkspaceRoot: true
