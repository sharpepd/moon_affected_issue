# Tasks for a conan project that produces a package.
---
$schema: "https://moonrepo.dev/schemas/tasks.json"
extends: "./tag-conanConsumer.yml"

fileGroups:
  # public
  conanfile:
    - "conanfile.py"
  # private
  conanCreateJson:
    - "build/task-data/conanCreate.conan.json"
  conanWriteArtProps:
    - "build/task-data/conanWriteArtProps.json"
  builddata:
    - "/build/task-data/builddata.json"
  conanOutputFolder:
    - "."

tasks:
  conanBuild:
    extends: "conanBaseCommandJson"
    args:
      - build
      - "@files(conanfile)"
      - --output-folder
      - "@group(conanOutputFolder)"
      - "'-pr:h'"
      - "@group(conanHostProfile)"
      - "'-pr:b'"
      - "@group(conanBuildProfile)"
      - "--build=missing"
    outputs:
      - build/**
    inputs:
      - "@files(conanfile)"
      - "@files(conandata)"
    toolchain: conan
    options:
      internal: false
    deps:
      - conanInstall

  conanGitVersionCheck:
    command: python
    args:
      - "-m"
      - "dpedo_armstrong.versioning"
      - "check"
      - "--cwd"
      - "$projectRoot"
      - "--input-file"
      - "@group(conanInfo)"
      - "--remote"
      - "origin"
      - "--log-level"
      - "DEBUG"
    deps:
      - conanInfo
    options:
      cache: false
    toolchain: python

  conanCreate:
    extends: "conanBaseCommandJson"
    args:
      - create
      - "@files(conanfile)"
      - "'-pr:h'"
      - "@group(conanHostProfile)"
      - "'-pr:b'"
      - "@group(conanBuildProfile)"
      - "--build=missing"
    outputs:
      - build/**
    inputs:
      - "@files(conanfile)"
      - "@files(conandata)"
    toolchain: conan
    options:
      internal: false
      cache: false
    deps:
      - ~:conanGitVersionCheck

  conanWriteArtProps:
    command: python
    args:
      - "-m"
      - "dpedo_armstrong.conan"
      - "write-art-props"
      - "--input-file"
      - "@group(builddata)"
      - "--output"
      - "@out(0)"
    outputs:
      - "@group(conanWriteArtProps)"
    options:
      internal: false
    deps:
      - ^:buildRegister
      - ~:conanInfo
    toolchain: python

  conanDeploy:
    extends: "conanBaseCommand"
    args:
      - dpe:upload
      - "-i"
      - "@group(conanCreateJson)"
      - "-p"
      - "@group(conanWriteArtProps)"
    options:
      internal: true
    toolchain: conan

  conanDeployDev:
    extends: "conanDeploy"
    args:
      - "-r"
      - azp037-conan-dev-local
      - "-cc"
      - "core.scm:local_url=allow"
    deps:
      - ~:conanCreate
      - ~:conanWriteArtProps
    options:
      internal: false
    toolchain: conan

  conanGitVersionTag:
    command: python
    args:
      - "-m"
      - "dpedo_armstrong.versioning"
      - "tag"
      - "--cwd"
      - "$projectRoot"
      - "--input-file"
      - "@group(conanInfo)"
      - "--remote"
      - "origin"
    deps:
      - registerConanProd
      - conanInfo
    options:
      cache: false
    toolchain: python

  conanDeployQa:
    extends: "conanDeploy"
    args:
      - "-r"
      - azp037-conan-qa-local
    deps:
      - ~:conanCreate
      - ~:conanWriteArtProps
    options:
      internal: false
    toolchain: conan

  conanDeployProd:
    extends: "conanDeploy"
    args:
      - "-r"
      - azp037-conan-prod-local
    deps:
      - ~:conanCreate
      - ~:conanWriteArtProps
    options:
      internal: false
    toolchain: conan

  .registerPackage:
    command: python -m dpedo_armstrong.buildm register-build-artifacts
    args:
      - "--conan-info"
      - "@group(conanCreateJson)"
      - "--builddata"
      - "@group(builddata)"
      - "--package-type"
      - "conan"
      - "--promotion-level"
    options:
      internal: true
    inputs:
      - "@group(builddata)"
      - "@group(conanCreateJson)"
    deps:
      - ^:buildRegister
    toolchain: python

  registerConanDev:
    extends: ".registerPackage"
    args:
      - "dev"
    deps:
      - "conanDeployDev"
    toolchain: python

  registerConanQA:
    extends: ".registerPackage"
    args:
      - "qa"
    deps:
      - "conanDeployQa"
    toolchain: python

  registerConanProd:
    extends: ".registerPackage"
    args:
      - "prod"
    deps:
      - "conanDeployProd"
    toolchain: python
