# Provides task for ensuring that the prototools files are installed.
---

tasks:
  .installTools:
    command: "proto"
    args:
      - "install"
      - "--log-file"
      - "@out(0)"
      - "--log"
      - "debug"
      - "--quiet"
    inputs:
      - "/.prototools"
      - ".prototools"
    outputs:
      - "build/logs/$task.log"
    options:
      internal: false
      outputStyle: "buffer-only-failure"
      cache: false
