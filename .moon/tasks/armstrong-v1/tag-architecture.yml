$schema: "https://moonrepo.dev/schemas/tasks.json"

extends: "./.ar-modelchecker-base.yml"

tasks:
  .autosarModelCheckerArchitectureLintBase:
    description: Provides a basic task to lint with Autosar Model Checker to check for architecture design issues.
    extends: .basicAutosarModelChecker
    options:
      mergeArgs: append
      internal: true
    args:
      - "$env:ARCHITECTURE_AR_MODELCHECKER_RULES"
      - -o
      - "$env:CONAN_OUTPUT_FOLDER/autosar-modelchecker/architecture"
