# Python project using UV
---
$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  src:
    - "src/**/*.py"

  projectConfig:
    - "pyproject.toml"
    - "uv.lock"

tasks:

  bump:
    command: uv run python -m dpedo_armstrong.python
    args:
      - bump
      - "--cwd"
      - "$projectRoot"
    inputs:
      - "@files(projectConfig)"
      - "@files(src)"
    outputs:
      - build/task-data/python-build-info.json
    toolchain: python
    options:
      cache: false #TODO Can we find a way to enable cache this and still get required behavior in pipeline?
      internal: true

  build:
    command: uv build --out-dir dist
    description: Build the project
    inputs:
      - "@files(src)"
      - "@files(projectConfig)"

    outputs:
      - "dist/*.whl"
      - "dist/*.tar.gz"
    toolchain: python
    deps:
      - bump

  test:
    command: uv run python -m pytest
    args:
      - "--junitxml=build/test-results/TEST-unittest.xml"
      - "--cov=."
      - "--cov-report=xml:build/test-results/coverage.xml"
      - "--cov-report=html:build/test-results/htmlcov"
      - "./tests"
    description: Test the project
    inputs:
      - "tests/**/*.py"
    outputs:
      - "build/test-results/TEST-unittest.xml"
      - "build/test-results/coverage.xml"
    toolchain: python
    deps:
      - build

  publish:
    command: uv run python -m dpedo_armstrong.python
    args:
      - publish
      - "--cwd"
      - "$projectRoot"
    toolchain: python
    inputs:
      - "dist/dpesteps-*.whl"
      - "dist/dpesteps-*.tar.gz"
      - build/task-data/python-build-info.json
    deps:
      - build
      # TODO test only needs to be done in PR - so this should be removed when we do a ci mode.
      - test
