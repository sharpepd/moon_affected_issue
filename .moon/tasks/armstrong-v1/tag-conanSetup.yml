# Tasks to setup/configure conan
---
$schema: "https://moonrepo.dev/schemas/tasks.json"

extends: "./.conan-base.yml"

tasks:

  conanSetup:
    description: |
      Deprecated set-up task. Replaced by moon conan plugin.
      See https://dpe-portal.zf-world.com/docs/default/component/tool-moonrepo-plugins/tools/.


  conanCacheClean:
    extends: "conanBaseCommand"
    description: |
      Clean non-critical files from the local cache. Run occasionally to reduce disk space.
    args:
      - "cache"
      - "clean"
      - "*"
    options:
      cache: false
      runInCI: false
      internal: false
    toolchain: conan