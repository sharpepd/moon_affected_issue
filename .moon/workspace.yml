# Workspace file armstrong-v1
# Use in extend keyword of the .moon/toolchain.yml in the repository.
---
$schema: "https://moonrepo.dev/schemas/workspace.json"
versionConstraint: ">=1.35.0"

# No telemetry to the moon project
telemetry: false

runner:
  # Always log the command so consumers understand what's happening.
  logRunningCommand: true

# Note that projects is not mergeable, so if this is not suitable for a project, it shall
# be redefined fully.
projects:
  globs:
    - "."

generator:
  templates:
    - https://artifactory.cloud.zf-world.com/artifactory/azp037-generic-prod-local/public/dpe/convention-sets/armstrong/dpetpl-latest.zip
    - git://dev.azure.com/SW4ZF/AZP-037_ADW_Tools/_git/PACK-Config-moontemplates#main

vcs:
  manager: "git"
  defaultBranch: "main"
  provider: other
