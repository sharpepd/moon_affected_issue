id: workspace

dependsOn:
  - workspace

fileGroups:
  conanHostProfile:
    - windows

tags:
  - conanSetup
  - conanPackage

tasks:
  publish:
    extends: "conanBaseCommand"
    args:
      - upload
      - "-r"
      - azp-037-test
      - my_conan_package

    deps:
      - ~:conanCreate
    options:
      internal: false
    toolchain: python