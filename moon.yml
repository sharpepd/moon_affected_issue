    - A
    options:
      windowsShell: bash
      # cache: false
  C:
    description: This is a bar2 task
    script: |
      echo "Running bar2 task"
    inputs:
    - 'README.md'
    deps:
    - B
    options:
      windowsShell: bash
      # cache: false
